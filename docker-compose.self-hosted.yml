version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnigrc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_production_password}
      POSTGRES_DB: ${POSTGRES_DB:-omnigrc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnigrc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: omnigrc-api:v1.0.0
    container_name: omnigrc-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      ORGANIZATION_ID: ${ORGANIZATION_ID}
      LICENSE_VERIFICATION_PUBLIC_KEY: ${LICENSE_VERIFICATION_PUBLIC_KEY}
      LICENSE_VERIFICATION_KEY_ID: ${LICENSE_VERIFICATION_KEY_ID}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-https://control-plane.omnigrc.co}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: omnigrc-web:v1.0.0
    container_name: omnigrc-web
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: omnigrc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
