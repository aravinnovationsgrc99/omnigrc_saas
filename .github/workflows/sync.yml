name: Sync to Company Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync Main Branch to Company Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Company Repository
        env:
          COMPANY_REPO_PAT: ${{ secrets.COMPANY_REPO_PAT }}
          COMPANY_REPO_URL: ${{ secrets.COMPANY_REPO_URL }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$COMPANY_REPO_PAT" ] && [ -n "$COMPANY_REPO_URL" ]; then
            CLEAN_URL=$(echo "$COMPANY_REPO_URL" | sed -E 's#^https?://##')
            AUTH_URL="https://x-access-token:${COMPANY_REPO_PAT}@${CLEAN_URL}"
            
            # Create temporary sync branch excluding .github/ to avoid requiring PAT 'workflow' scope
            git checkout -b temp-sync-branch
            git rm -rf .github/workflows/ || true
            git commit -m "sync: deploy application code to company repository" || true

            git remote add company "$AUTH_URL"
            git push company temp-sync-branch:main --force
            echo "Successfully synced application code to target company repository."
          else
            echo "::error::Secrets COMPANY_REPO_URL or COMPANY_REPO_PAT are missing in repository settings."
            exit 1
          fi
